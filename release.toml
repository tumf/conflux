# cargo-release configuration
# https://github.com/crate-ci/cargo-release

# Branch restrictions
allow-branch = ["main", "master"]

# Publishing (disabled until ready for crates.io)
publish = false

# Git settings
push-remote = "origin"
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"
pre-release-commit-message = "chore(release): release v{{version}}"

# No pre-release replacements: the manifest and lockfile are the only
# release-owned files. The API contract is generated at runtime from
# src/web/openapi.rs, so there is no version string in a tracked schema to
# rewrite here.
