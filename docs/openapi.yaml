openapi: 3.1.0
info:
  title: Conflux Web Monitoring API
  description: REST API for monitoring and controlling Conflux orchestration
  contact:
    name: Conflux
    url: https://github.com/anomalyco/conflux
  license:
    name: MIT
    identifier: MIT
  version: 0.6.212
paths:
  /api/changes:
    get:
      tags:
      - changes
      summary: List all changes
      operationId: list_changes
      responses:
        '200':
          description: List of all changes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChangeStatus'
  /api/changes/{id}:
    get:
      tags:
      - changes
      summary: Get a specific change by ID
      operationId: get_change
      parameters:
      - name: id
        in: path
        description: Change ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Change found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeStatus'
        '404':
          description: Change not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/control/cancel-stop:
    post:
      tags:
      - control
      summary: Cancel a pending stop request
      description: |-
        # Endpoint
        POST /api/control/cancel-stop

        # Returns
        - 200 OK if stop is canceled
        - 409 Conflict if not in stopping mode
        - 500 Internal Server Error if control channel not available
      operationId: control_cancel_stop
      responses:
        '200':
          description: Stop canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlResponse'
        '409':
          description: Not in stopping mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Control channel error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/control/force-stop:
    post:
      tags:
      - control
      summary: Force stop immediately
      description: |-
        # Endpoint
        POST /api/control/force-stop

        # Returns
        - 200 OK if force stop is initiated
        - 409 Conflict if not running or stopping
        - 500 Internal Server Error if control channel not available
      operationId: control_force_stop
      responses:
        '200':
          description: Force stop initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlResponse'
        '409':
          description: Not running or stopping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Control channel error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/control/retry:
    post:
      tags:
      - control
      summary: Retry error changes
      description: |-
        # Endpoint
        POST /api/control/retry

        # Returns
        - 200 OK if retry is initiated
        - 409 Conflict if not in error mode
        - 500 Internal Server Error if control channel not available
      operationId: control_retry
      responses:
        '200':
          description: Retry initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlResponse'
        '409':
          description: Not in error mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Control channel error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/control/start:
    post:
      tags:
      - control
      summary: Start or resume processing
      description: |-
        # Endpoint
        POST /api/control/start

        # Returns
        - 200 OK if start/resume is successful
        - 409 Conflict if already running or stopping
        - 500 Internal Server Error if control channel not available
      operationId: control_start
      responses:
        '200':
          description: Processing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlResponse'
        '409':
          description: Already running or stopping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Control channel error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/control/stop:
    post:
      tags:
      - control
      summary: Stop processing (graceful shutdown)
      description: |-
        # Endpoint
        POST /api/control/stop

        # Returns
        - 200 OK if stop is initiated
        - 409 Conflict if not running
        - 500 Internal Server Error if control channel not available
      operationId: control_stop
      responses:
        '200':
          description: Stop initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlResponse'
        '409':
          description: Not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Control channel error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/health:
    get:
      tags:
      - health
      summary: Health check endpoint
      operationId: health
      responses:
        '200':
          description: Health check successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/state:
    get:
      tags:
      - state
      summary: Get full orchestrator state
      operationId: get_state
      responses:
        '200':
          description: Current orchestrator state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestratorStateSnapshot'
  /api/v2/capabilities:
    get:
      tags:
      - remote-control
      summary: Complete description of what this instance accepts and guarantees.
      operationId: capabilities
      responses:
        '200':
          description: Supported commands, transports, and limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /api/v2/changes:
    get:
      tags:
      - remote-control
      summary: Projected changes with their reducer-derived display statuses.
      operationId: list_changes
      responses:
        '200':
          description: Projected changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'
  /api/v2/changes/{change_id}:
    get:
      tags:
      - remote-control
      summary: One projected change.
      operationId: get_change
      parameters:
      - name: change_id
        in: path
        description: Change ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Projected change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeResponse'
        '404':
          description: No such change in this incarnation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/commands:
    post:
      tags:
      - remote-control
      summary: Submit a command from the closed v2 command set.
      operationId: submit_command
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
        required: true
      responses:
        '200':
          description: Completed synchronously, replayed, or an explicit no-op
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandRecord'
        '202':
          description: Accepted and still running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandRecord'
        '409':
          description: Stale revision, lifecycle, eligibility, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Schema or correlation-ID validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: No record slot could be reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/commands/{command_id}:
    get:
      tags:
      - remote-control
      summary: Look up a previously submitted command.
      operationId: get_command
      parameters:
      - name: command_id
        in: path
        description: Command ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Command record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandRecord'
        '404':
          description: No such command in this incarnation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/events:
    get:
      tags:
      - remote-control
      summary: Server-Sent Events transport.
      description: |-
        Authenticated browser clients must consume this with `fetch()` response
        streaming; native `EventSource` cannot attach the bearer token and is not
        supported.
      operationId: events
      parameters:
      - name: after_sequence
        in: query
        description: Resume strictly after this event sequence
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: instance_id
        in: query
        description: Incarnation the cursor belongs to
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ordered SSE event stream (fetch() response streaming)
        '401':
          description: Missing or invalid bearer credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/health:
    get:
      tags:
      - remote-control
      summary: |-
        Liveness probe. Always unauthenticated so an operator can tell "down" apart
        from "misconfigured credentials" without holding a token.
      operationId: health
      responses:
        '200':
          description: Process is serving requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v2/instance:
    get:
      tags:
      - remote-control
      summary: Process incarnation identity. Clients compare `instance_id` before reusing a cursor.
      operationId: instance
      responses:
        '200':
          description: Process incarnation identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
  /api/v2/logs:
    get:
      tags:
      - remote-control
      summary: Bounded observational log ring.
      operationId: logs
      responses:
        '200':
          description: Retained log entries, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'
  /api/v2/state:
    get:
      tags:
      - remote-control
      summary: Coherent full snapshot plus the cursor to resume streaming from.
      operationId: state
      responses:
        '200':
          description: Coherent snapshot with its revision and cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
  /api/v2/worktrees:
    get:
      tags:
      - remote-control
      summary: Current worktrees, each with the opaque ID that addresses it.
      description: |-
        Unlike the other reads this one observes the repository rather than the
        projection, because worktree existence is a filesystem/Git fact and a stale
        projection of it would hand a client an ID that no longer names anything.
      operationId: list_worktrees
      responses:
        '200':
          description: Current worktrees with opaque IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorktreesResponse'
        '409':
          description: No worktree runtime is bound yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: The repository could not be observed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/worktrees/{worktree_id}:
    get:
      tags:
      - remote-control
      summary: One worktree, addressed only by its opaque ID.
      operationId: get_worktree
      parameters:
      - name: worktree_id
        in: path
        description: Opaque process-local worktree ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The requested worktree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorktreeResponse'
        '404':
          description: The ID is unknown or was retired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: No worktree runtime is bound yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/ws:
    get:
      tags:
      - remote-control
      summary: WebSocket transport for non-browser clients.
      description: |-
        Authentication already happened in the v2 middleware, which also rejected any
        token supplied through the query string or `Sec-WebSocket-Protocol`, so by the
        time the upgrade runs the connection is known to be authorized.
      operationId: ws
      parameters:
      - name: after_sequence
        in: query
        description: Resume strictly after this event sequence
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: instance_id
        in: query
        description: Incarnation the cursor belongs to
        required: false
        schema:
          type: string
      responses:
        '101':
          description: Switching protocols
        '401':
          description: Missing bearer header, or credentials in query/subprotocol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /ws:
    get:
      tags:
      - websocket
      summary: WebSocket connection handler for real-time state updates
      description: |-
        This endpoint upgrades the HTTP connection to a WebSocket connection
        and streams state updates to the client in real-time.

        # Protocol
        - Upon connection, the server sends an initial state message
        - Subsequently, the server broadcasts state updates as they occur
        - The client can send ping frames to keep the connection alive
        - The server responds with pong frames automatically

        # Message Format
        All messages are JSON-encoded with the following structure:
        ```json
        {
          "type": "initial_state" | "state_update",
          "timestamp": "ISO 8601 timestamp",
          "state": { ... }  // OrchestratorStateSnapshot
        }
        ```
      operationId: ws_handler
      responses:
        '101':
          description: Switching Protocols - WebSocket connection established
        '400':
          description: Bad Request - Not a valid WebSocket upgrade request
components:
  schemas:
    ApiError:
      type: object
      description: Structured error body returned by every non-success v2 response.
      required:
      - error_code
      - message
      - correlation_id
      properties:
        correlation_id:
          type: string
          description: Correlation ID of the failing request (caller-supplied or generated).
        current_revision:
          type:
          - integer
          - 'null'
          format: int64
          description: Current state revision, when the failure is revision-related.
          minimum: 0
        error_code:
          $ref: '#/components/schemas/ErrorCode'
          description: Stable code the client branches on.
        message:
          type: string
          description: Sanitized human-readable detail.
    CapabilitiesResponse:
      type: object
      description: '`GET /api/v2/capabilities` body.'
      required:
      - api_version
      - instance_id
      - commands
      - transports
      - error_codes
      - limits
      - authentication_required
      - worktrees
      properties:
        api_version:
          type: string
          description: API namespace version.
        authentication_required:
          type: boolean
          description: True when bearer authentication is enforced.
        commands:
          type: array
          items:
            type: string
          description: Closed command set accepted by `POST /api/v2/commands`.
        error_codes:
          type: array
          items:
            type: string
          description: Every error code this API can return.
        instance_id:
          type: string
          description: Process incarnation ID.
        limits:
          $ref: '#/components/schemas/CapabilityLimits'
          description: Retention and admission limits.
        transports:
          type: array
          items:
            $ref: '#/components/schemas/TransportDescriptor'
          description: Supported event transports and their required client style.
        worktrees:
          $ref: '#/components/schemas/WorktreeCapabilities'
          description: The complete worktree surface, including its conflict-recovery boundary.
    CapabilityLimits:
      type: object
      description: Retention and admission limits advertised to clients.
      required:
      - max_events
      - max_logs
      - max_commands
      - max_idempotency_records
      - command_record_ttl_secs
      - max_correlation_id_len
      properties:
        command_record_ttl_secs:
          type: integer
          format: int64
          description: Completed-record expiry in seconds.
        max_commands:
          type: integer
          description: Command registry admission limit.
          minimum: 0
        max_correlation_id_len:
          type: integer
          description: Maximum caller correlation ID length.
          minimum: 0
        max_events:
          type: integer
          description: Retained events.
          minimum: 0
        max_idempotency_records:
          type: integer
          description: Idempotency registry admission limit.
          minimum: 0
        max_logs:
          type: integer
          description: Retained logs.
          minimum: 0
    ChangeResource:
      type: object
      description: One change as projected into the v2 snapshot.
      required:
      - id
      - display_status
      - progress_status
      - completed_tasks
      - total_tasks
      - progress_percent
      - dependencies
      properties:
        completed_tasks:
          type: integer
          format: int32
          description: Completed tasks.
          minimum: 0
        dependencies:
          type: array
          items:
            type: string
          description: Declared dependencies.
        display_status:
          type: string
          description: Reducer-derived display status (canonical taxonomy).
        id:
          type: string
          description: Change ID.
        iteration_number:
          type:
          - integer
          - 'null'
          format: int32
          description: Apply/archive iteration number, when a loop is running.
          minimum: 0
        progress_percent:
          type: number
          format: float
          description: Progress percentage (0-100).
        progress_status:
          type: string
          description: Task-progress status (`pending`, `in_progress`, `complete`).
        total_tasks:
          type: integer
          format: int32
          description: Total tasks.
          minimum: 0
    ChangeResponse:
      type: object
      description: '`GET /api/v2/changes/{change_id}` body.'
      required:
      - instance_id
      - state_revision
      - change
      properties:
        change:
          $ref: '#/components/schemas/ChangeResource'
          description: The projected change.
        instance_id:
          type: string
          description: Process incarnation ID.
        state_revision:
          type: integer
          format: int64
          description: Revision the change was read at.
          minimum: 0
    ChangeStatus:
      type: object
      description: Change status for WebSocket updates
      required:
      - id
      - completed_tasks
      - total_tasks
      - progress_percent
      - status
      - dependencies
      properties:
        completed_tasks:
          type: integer
          format: int32
          description: Number of completed tasks
          minimum: 0
        dependencies:
          type: array
          items:
            type: string
          description: Dependencies on other changes
        id:
          type: string
          description: Change ID
        iteration_number:
          type:
          - integer
          - 'null'
          format: int32
          description: Current iteration number for apply/archive loops
          minimum: 0
        progress_percent:
          type: number
          format: float
          description: Progress percentage (0-100)
        queue_status:
          type:
          - string
          - 'null'
          description: |-
            Queue status (for parallel/serial execution tracking)
            Aligned with canonical display taxonomy values: "not queued", "queued", "blocked", "stalled", "applying",
            "accepting", "archiving", "archived", "merged", "pushed", "rejected", "merge wait", "resolving", "resolve pending", "reject pending", "error"
        status:
          type: string
          description: 'Current status: "pending", "in_progress", "complete"'
        total_tasks:
          type: integer
          format: int32
          description: Total number of tasks
          minimum: 0
    ChangeTarget:
      type: object
      description: |-
        Change-addressed command target.

        `deny_unknown_fields` is the security property, not a nicety: it is what makes
        a smuggled `path`, `branch`, or `base_commit` a schema failure instead of a
        silently ignored field.
      required:
      - change_id
      properties:
        change_id:
          type: string
          description: Managed, non-archived change ID.
      additionalProperties: false
    ChangesResponse:
      type: object
      description: '`GET /api/v2/changes` body.'
      required:
      - instance_id
      - state_revision
      - changes
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeResource'
          description: Projected changes.
        instance_id:
          type: string
          description: Process incarnation ID.
        state_revision:
          type: integer
          format: int64
          description: Revision the list was read at.
          minimum: 0
    CommandRecord:
      type: object
      description: Command record returned by `POST /api/v2/commands` and by status lookup.
      required:
      - command_id
      - instance_id
      - type
      - state
      - expected_revision
      - correlation_id
      - idempotency_key
      - created_at
      properties:
        command_id:
          type: string
          description: Random 128-bit hexadecimal command ID.
        completed_at:
          type:
          - string
          - 'null'
          description: Completion time (RFC 3339), when finished.
        correlation_id:
          type: string
          description: Correlation label of the submitting request.
        created_at:
          type: string
          description: Submission time (RFC 3339).
        detail:
          type:
          - string
          - 'null'
          description: Sanitized outcome detail.
        error_code:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ErrorCode'
            description: Typed failure code when `state` is `failed`.
        expected_revision:
          type: integer
          format: int64
          description: Revision the command was admitted against.
          minimum: 0
        idempotency_key:
          type: string
          description: Replay key this record is bound to.
        instance_id:
          type: string
          description: Process incarnation that owns this record.
        result_revision:
          type:
          - integer
          - 'null'
          format: int64
          description: Revision observed once the command finished.
          minimum: 0
        state:
          $ref: '#/components/schemas/CommandState'
          description: Current lifecycle state.
        type:
          type: string
          description: Wire discriminant of the submitted command.
    CommandRequest:
      allOf:
      - $ref: '#/components/schemas/CommandSpec'
        description: Discriminated command payload.
      - type: object
        required:
        - expected_revision
        - idempotency_key
        properties:
          correlation_id:
            type:
            - string
            - 'null'
            description: Optional opaque trace label.
          expected_revision:
            type: integer
            format: int64
            description: Revision the caller believes is current.
            minimum: 0
          idempotency_key:
            type: string
            description: Caller-chosen replay key, unique per intended side effect.
      description: |-
        `POST /api/v2/commands` request envelope.

        Every command is side-effecting, so `expected_revision` and
        `idempotency_key` are mandatory for all of them without exception.
    CommandSpec:
      oneOf:
      - type: object
        description: Start or resume processing.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - start
      - type: object
        description: Request a graceful stop.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - stop
      - type: object
        description: Cancel a pending graceful stop.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - cancel_stop
      - type: object
        description: Stop immediately.
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - force_stop
      - type: object
        description: Set the process-local execution mark for a change.
        required:
        - change_id
        - marked
        - type
        properties:
          change_id:
            type: string
            description: Target change.
          marked:
            type: boolean
            description: Requested mark value.
          type:
            type: string
            enum:
            - set_execution_mark
      - type: object
        description: Set dynamic queue intent for a change.
        required:
        - change_id
        - queued
        - type
        properties:
          change_id:
            type: string
            description: Target change.
          queued:
            type: boolean
            description: Requested queue membership.
          type:
            type: string
            enum:
            - set_queue_intent
      - type: object
        description: Retry one change using its reconciled evidence.
        required:
        - change_id
        - type
        properties:
          change_id:
            type: string
            description: Target change.
          type:
            type: string
            enum:
            - retry_change
      - type: object
        description: Retry every listed change that carries retryable evidence.
        required:
        - type
        properties:
          change_ids:
            type: array
            items:
              type: string
            description: Candidate changes; unsupported entries are skipped, not rejected.
          type:
            type: string
            enum:
            - retry_errors
      - type: object
        description: Stop an in-flight change and dequeue it after confirmed termination.
        required:
        - change_id
        - type
        properties:
          change_id:
            type: string
            description: Target change.
          type:
            type: string
            enum:
            - stop_and_dequeue
      - type: object
        description: Request merge resolution for a change waiting on a merge.
        required:
        - change_id
        - type
        properties:
          change_id:
            type: string
            description: Target change.
          type:
            type: string
            enum:
            - resolve_merge
      - type: object
        description: |-
          Create the managed worktree for an eligible change.

          The change ID is the *only* input: branch, path, and base commit are all
          server-derived, so no client can steer where the worktree lands or what
          it is cut from.
        required:
        - target
        - type
        properties:
          params:
            $ref: '#/components/schemas/EmptyParams'
            description: Reserved and always empty.
          target:
            $ref: '#/components/schemas/ChangeTarget'
            description: The change to create a worktree for.
          type:
            type: string
            enum:
            - create_worktree
      - type: object
        description: Delete a worktree addressed by its opaque ID.
        required:
        - target
        - type
        properties:
          params:
            $ref: '#/components/schemas/EmptyParams'
            description: Reserved and always empty. There is no teardown bypass or force flag.
          target:
            $ref: '#/components/schemas/WorktreeTarget'
            description: The worktree to delete.
          type:
            type: string
            enum:
            - delete_worktree
      - type: object
        description: Merge a worktree's branch into base.
        required:
        - target
        - type
        properties:
          params:
            $ref: '#/components/schemas/EmptyParams'
            description: Reserved and always empty.
          target:
            $ref: '#/components/schemas/WorktreeTarget'
            description: The worktree to merge.
          type:
            type: string
            enum:
            - merge_worktree
      description: |-
        The closed v2 command set.

        Adding a variant is a spec change: an envelope naming any other type fails
        typed validation before a service call can happen.
    CommandState:
      type: string
      description: Lifecycle of a submitted command within this process incarnation.
      enum:
      - running
      - succeeded
      - no_op
      - failed
    ControlResponse:
      type: object
      description: Success response for control operations
      required:
      - success
      - message
      properties:
        message:
          type: string
        success:
          type: boolean
    EmptyParams:
      type: object
      description: |-
        A parameter object that accepts nothing.

        Present so the wire shape is stable if a parameter is ever added, and so that
        every unrecognized parameter fails validation today.
      additionalProperties: false
    ErrorCode:
      type: string
      description: |-
        Stable, machine-actionable v2 error codes.

        The HTTP status classifies the transport failure; the client branches on
        `error_code`. Two different causes may share status 409, so the code — not
        the status — is the contract.
      enum:
      - unauthorized
      - forbidden
      - not_found
      - stale_revision
      - lifecycle_conflict
      - target_ineligible
      - root_busy
      - idempotency_mismatch
      - registry_capacity
      - validation_failed
      - worktree_exists
      - worktree_not_found
      - worktree_dirty
      - worktree_dirty_unknown
      - merge_conflict
      - internal_error
    ErrorResponse:
      type: object
      description: Error response for API errors
      required:
      - error
      properties:
        error:
          type: string
    EventCategory:
      type: string
      description: What an event envelope carries.
      enum:
      - state
      - log
      - gap
    EventEnvelope:
      type: object
      description: One ordered event on the v2 stream.
      required:
      - instance_id
      - event_sequence
      - state_revision
      - category
      - event_type
      - timestamp
      - payload
      properties:
        category:
          $ref: '#/components/schemas/EventCategory'
          description: Envelope category.
        change_id:
          type:
          - string
          - 'null'
          description: Change this event is about, when it has one.
        event_sequence:
          type: integer
          format: int64
          description: Monotonic process-local sequence number.
          minimum: 0
        event_type:
          type: string
          description: Specific event kind (for example `processing_started`).
        instance_id:
          type: string
          description: Process incarnation that allocated this sequence.
        payload:
          description: Kind-specific detail.
        state_revision:
          type: integer
          format: int64
          description: State revision associated with this event.
          minimum: 0
        timestamp:
          type: string
          description: Emission time (RFC 3339).
    HealthResponse:
      type: object
      description: '`GET /api/v2/health` body. This resource is always unauthenticated.'
      required:
      - status
      - api_version
      - version
      properties:
        api_version:
          type: string
          description: API namespace version.
        status:
          type: string
          description: Always `ok` while the process serves requests.
        version:
          type: string
          description: Build version string.
    InstanceResponse:
      type: object
      description: '`GET /api/v2/instance` body.'
      required:
      - instance_id
      - started_at
      - pid
      - version
      - api_version
      properties:
        api_version:
          type: string
          description: API namespace version.
        instance_id:
          type: string
          description: Random 128-bit hexadecimal process incarnation ID.
        pid:
          type: integer
          format: int32
          description: Operating-system process ID.
          minimum: 0
        started_at:
          type: string
          description: Process start time (RFC 3339).
        version:
          type: string
          description: Build version string.
    InstanceSnapshot:
      type: object
      description: |-
        Coherent projection of everything a controller needs to decide the next command.

        Deliberately excludes logs and timestamps: logs are an observational
        resource, and a wall-clock field would make every projection look changed and
        advance the revision forever.
      required:
      - app_mode
      - is_resolving
      - changes
      - totals
      properties:
        app_mode:
          type: string
          description: Operator-facing application mode.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeResource'
          description: Projected changes.
        is_resolving:
          type: boolean
          description: Whether merge resolution is currently running.
        totals:
          $ref: '#/components/schemas/SnapshotTotals'
          description: Aggregate counts.
    LogEntry:
      type: object
      description: Log entry for the TUI
      required:
      - timestamp
      - created_at
      - message
      - level
      properties:
        change_id:
          type:
          - string
          - 'null'
          description: Optional change_id for parallel mode logs
        created_at:
          type: string
          format: date-time
          description: Creation time (actual timestamp for relative time calculation)
        iteration:
          type:
          - integer
          - 'null'
          format: int32
          description: Optional iteration number (for apply operations)
          minimum: 0
        level:
          $ref: '#/components/schemas/LogLevel'
          description: Log level
        message:
          type: string
          description: Log message
        operation:
          type:
          - string
          - 'null'
          description: Optional operation type (apply, archive, resolve)
        timestamp:
          type: string
          description: Timestamp (formatted for display)
        workspace_path:
          type:
          - string
          - 'null'
          description: Optional workspace path (for parallel mode logs with workspace context)
    LogLevel:
      type: string
      description: Log level for TUI logs
      enum:
      - info
      - success
      - warn
      - error
    LogsResponse:
      type: object
      description: '`GET /api/v2/logs` body.'
      required:
      - instance_id
      - state_revision
      - event_sequence
      - logs
      properties:
        event_sequence:
          type: integer
          format: int64
          description: Latest allocated event sequence.
          minimum: 0
        instance_id:
          type: string
          description: Process incarnation ID.
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
          description: Retained log entries, oldest first.
        state_revision:
          type: integer
          format: int64
          description: Revision the logs were read at (logs never advance it).
          minimum: 0
    MergeConflictInfo:
      type: object
      description: Merge conflict information for a worktree
      required:
      - conflict_files
      properties:
        conflict_files:
          type: array
          items:
            type: string
          description: List of files with merge conflicts
    OrchestratorStateSnapshot:
      type: object
      description: Full orchestrator state snapshot for REST API
      required:
      - changes
      - total_changes
      - completed_changes
      - in_progress_changes
      - pending_changes
      - last_updated
      - logs
      - worktrees
      - app_mode
      - is_resolving
      properties:
        app_mode:
          type: string
          description: Application mode (e.g., "select", "running", "stopped")
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeStatus'
          description: List of all changes
        completed_changes:
          type: integer
          description: Number of completed changes
          minimum: 0
        in_progress_changes:
          type: integer
          description: Number of in-progress changes
          minimum: 0
        is_resolving:
          type: boolean
          description: Whether resolve is currently running
        last_updated:
          type: string
          description: Timestamp of last update
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
          description: Log entries (TUI-equivalent)
        pending_changes:
          type: integer
          description: Number of pending changes
          minimum: 0
        total_changes:
          type: integer
          description: Total number of changes
          minimum: 0
        worktrees:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeInfo'
          description: Worktree list (TUI-equivalent)
    SnapshotTotals:
      type: object
      description: Aggregate counts over the projected changes.
      required:
      - total
      - completed
      - in_progress
      - pending
      properties:
        completed:
          type: integer
          description: Changes in a completed terminal status.
          minimum: 0
        in_progress:
          type: integer
          description: Changes actively executing.
          minimum: 0
        pending:
          type: integer
          description: Changes queued but not started.
          minimum: 0
        total:
          type: integer
          description: Number of projected changes.
          minimum: 0
    StateResponse:
      type: object
      description: '`GET /api/v2/state` body: a coherent snapshot with its revision and cursor.'
      required:
      - instance_id
      - state_revision
      - event_sequence
      - snapshot
      properties:
        event_sequence:
          type: integer
          format: int64
          description: Latest allocated event sequence; a valid replay cursor.
          minimum: 0
        instance_id:
          type: string
          description: Process incarnation ID this snapshot belongs to.
        snapshot:
          $ref: '#/components/schemas/InstanceSnapshot'
          description: The snapshot itself.
        state_revision:
          type: integer
          format: int64
          description: Revision of the returned snapshot.
          minimum: 0
    StateUpdate:
      type: object
      description: State update message sent to WebSocket clients
      required:
      - type
      - timestamp
      - changes
      properties:
        app_mode:
          type:
          - string
          - 'null'
          description: Application mode (optional, sent with mode change events)
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeStatus'
          description: List of changes with current status
        logs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LogEntry'
          description: Log entries (optional, sent with log events)
        timestamp:
          type: string
          description: ISO 8601 timestamp
        type:
          type: string
          description: Type of update message
        worktrees:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/WorktreeInfo'
          description: Worktree list (optional, sent with worktree refresh events)
    TransportDescriptor:
      type: object
      description: One supported event transport.
      required:
      - name
      - path
      - client
      - browser_native_supported
      properties:
        browser_native_supported:
          type: boolean
          description: Whether the browser-native API for this transport is supported.
        client:
          type: string
          description: |-
            Client style this transport supports.

            Authenticated v2 has no browser-native client: SSE requires `fetch()`
            response streaming and the WebSocket requires an Authorization header
            during upgrade, which browsers cannot set.
        name:
          type: string
          description: Transport name (`sse` or `websocket`).
        path:
          type: string
          description: Path the transport is served on.
    WorktreeCapabilities:
      type: object
      description: Worktree section of `GET /api/v2/capabilities`.
      required:
      - operations
      - merge_conflict_recovery
      - merge_conflict_preserves_state
      - delete_requires_teardown
      properties:
        delete_requires_teardown:
          type: boolean
          description: True when deletion always runs managed teardown with no bypass.
        merge_conflict_preserves_state:
          type: boolean
          description: True when a conflicting merge leaves the intermediate Git state in place.
        merge_conflict_recovery:
          type: string
          description: How a merge conflict is recovered from. Always `local_or_tui_required`.
        operations:
          type: array
          items:
            type: string
          description: Advertised operations. Nothing outside this list is reachable.
    WorktreeConflict:
      type: object
      description: Conflict evidence attached to a worktree or a failed merge.
      required:
      - files
      - recovery
      properties:
        files:
          type: array
          items:
            type: string
          description: Repository-relative conflicted paths.
        recovery:
          type: string
          description: How the conflict must be resolved. Always `local_or_tui_required`.
    WorktreeEligibility:
      type: object
      description: Which operations this worktree can currently accept, and why not.
      required:
      - deletable
      - mergeable
      properties:
        deletable:
          type: boolean
          description: True when `delete_worktree` would pass its guards right now.
        delete_blocked_reason:
          type:
          - string
          - 'null'
          description: Why deletion is refused, when it is.
        merge_blocked_reason:
          type:
          - string
          - 'null'
          description: Why merging is refused, when it is.
        mergeable:
          type: boolean
          description: True when `merge_worktree` would pass its guards right now.
    WorktreeInfo:
      type: object
      description: Information about a git worktree
      required:
      - path
      - head
      - branch
      - is_detached
      - is_main
      - has_commits_ahead
      - is_merging
      properties:
        branch:
          type: string
          description: Branch name (empty if detached)
        has_commits_ahead:
          type: boolean
          description: Whether this worktree has commits ahead of the base branch
        head:
          type: string
          description: Current HEAD commit (short hash or symbolic ref)
        is_detached:
          type: boolean
          description: Whether HEAD is detached
        is_main:
          type: boolean
          description: Whether this is the main worktree
        is_merging:
          type: boolean
          description: Whether a merge operation is in progress for this worktree
        merge_conflict:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MergeConflictInfo'
            description: Merge conflict information (None if not checked or no conflicts)
        path:
          type: string
          description: Path to the worktree
    WorktreeResource:
      type: object
      description: One worktree as `/api/v2` exposes it.
      required:
      - worktree_id
      - repository_id
      - path
      - branch
      - head
      - is_main
      - is_detached
      - has_commits_ahead
      - operations
      properties:
        branch:
          type: string
          description: Checked-out branch, empty when detached.
        conflict:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WorktreeConflict'
            description: Conflict evidence, when a base merge would conflict or already has.
        dirty:
          type:
          - boolean
          - 'null'
          description: |-
            Uncommitted-change state. `null` means it could not be determined, which
            makes the worktree undeletable rather than deletable.
        has_commits_ahead:
          type: boolean
          description: True when this branch has commits base does not have.
        head:
          type: string
          description: Current HEAD commit.
        is_detached:
          type: boolean
          description: True when HEAD is detached.
        is_main:
          type: boolean
          description: True for the repository's main worktree.
        operations:
          $ref: '#/components/schemas/WorktreeEligibility'
          description: Current operation eligibility.
        path:
          type: string
          description: Repository-relative display path. Never the canonical or absolute root.
        repository_id:
          type: string
          description: 16-hex FNV-1a repository correlation ID. Not a secret, not authorization.
        worktree_id:
          type: string
          description: Random 128-bit process-local hexadecimal ID. The only mutation identity.
    WorktreeResponse:
      type: object
      description: '`GET /api/v2/worktrees/{worktree_id}` body.'
      required:
      - instance_id
      - state_revision
      - worktree
      properties:
        instance_id:
          type: string
          description: Process incarnation ID.
        state_revision:
          type: integer
          format: int64
          description: Revision the worktree was read at.
          minimum: 0
        worktree:
          $ref: '#/components/schemas/WorktreeResource'
          description: The requested worktree.
    WorktreeTarget:
      type: object
      description: |-
        Worktree-addressed command target.

        Only the opaque process-local ID addresses a worktree. A path, a branch, or a
        repository correlation ID is never accepted as mutation identity.
      required:
      - worktree_id
      properties:
        worktree_id:
          type: string
          description: Opaque 128-bit hexadecimal worktree ID from a v2 read.
      additionalProperties: false
    WorktreesResponse:
      type: object
      description: '`GET /api/v2/worktrees` body.'
      required:
      - instance_id
      - state_revision
      - repository_id
      - worktrees
      properties:
        instance_id:
          type: string
          description: Process incarnation ID.
        repository_id:
          type: string
          description: Repository correlation ID shared by every listed worktree.
        state_revision:
          type: integer
          format: int64
          description: Revision the list was read at.
          minimum: 0
        worktrees:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeResource'
          description: Current worktrees.
tags:
- name: health
  description: Health check endpoints
- name: state
  description: State management endpoints
- name: changes
  description: Change management endpoints
- name: control
  description: Orchestrator control endpoints
- name: websocket
  description: WebSocket endpoints for real-time updates
- name: remote-control
  description: Single-instance remote-control API (/api/v2)
