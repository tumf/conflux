default_install_hook_types: [pre-commit]
exclude: ^graphify-out/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^(graphify-out/(graph\.html|graph\.json|GRAPH_REPORT\.md)|dashboard/dist/assets/index-.*\.(js|css))$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        exclude: ^(graphify-out/(graph\.html|graph\.json|GRAPH_REPORT\.md)|dashboard/dist/assets/index-.*\.js)$
  - repo: local
    hooks:
      - id: beads-pre-commit
        name: beads pre-commit
        entry: sh -c 'if command -v bd >/dev/null 2>&1; then BD_GIT_HOOK=1 bd hooks run pre-commit; else echo "bd not installed; skipping beads pre-commit"; fi'
        language: system
        pass_filenames: false
        always_run: true
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        always_run: true
      - id: clippy
        name: clippy
        entry: cargo clippy --locked --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
