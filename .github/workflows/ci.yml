# CI workflow for Conflux
# Runs the same pre-commit/prek hooks as local checks

name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      # Not "docs/**": docs/ still holds executable material whose checks must
      # run. Only the image assets are inert.
      - "docs/images/**"
      - "openspec/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      # Not "docs/**": docs/ still holds executable material whose checks must
      # run. Only the image assets are inert.
      - "docs/images/**"
      - "openspec/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

      - name: Run pre-commit/prek hooks (all files)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit
          pre-commit run --all-files || pre-commit run --all-files

      # The API contract is generated, not tracked, so there is no artifact to
      # diff. These assertions are what keeps the generated document honest
      # against the executable surface, and they must run on every pull request.
      - name: Run OpenAPI contract tests
        run: cargo test --features web-monitoring --test openapi_contract_tests
