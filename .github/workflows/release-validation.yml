name: Release validation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate release procedure and installed skills
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="${RUNNER_TEMP}/release-validation.log"
          ./scripts/release.sh --dry-run patch | tee "$LOG_FILE"
          cargo test --test install_skills_test | tee -a "$LOG_FILE"

      - name: Publish validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-log
          path: ${{ runner.temp }}/release-validation.log
