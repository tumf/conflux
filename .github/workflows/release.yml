# Release workflow for Conflux
# Triggered by version tags (v*.*.*)
# Publishes Linux binaries built by GitHub Actions

name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Linux targets built and published by GitHub Actions
  PLAN: >-
    [
      {"os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu"},
      {"os": "ubuntu-22.04", "target": "aarch64-unknown-linux-gnu"}
    ]

jobs:
  # Determine build matrix
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
      val: ${{ steps.plan.outputs.val }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Determine tag
        id: plan
        run: |
          # Get tag from ref or use dev for PRs
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="dev"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Write matrix as multiline output
          {
            echo "matrix<<EOF"
            echo "$PLAN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Validate version format for release tags
          if [[ "$TAG" != "dev" ]]; then
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
              echo "::error::Invalid version tag format: $TAG"
              exit 1
            fi
            echo "val=true" >> "$GITHUB_OUTPUT"
          else
            echo "val=false" >> "$GITHUB_OUTPUT"
          fi

  # Build platform-specific artifacts
  build-local-artifacts:
    name: Build (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          cargo build --release --target ${{ matrix.target }}

      - name: Build (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cflx dist/
          cd dist
          tar -czvf cflx-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.tar.gz cflx
          rm cflx

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*

  # Build global artifacts (checksums, installers)
  build-global-artifacts:
    name: Build global artifacts
    needs: [plan, build-local-artifacts]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Generate shell installer
        run: |
          cat > artifacts/install.sh << 'INSTALLER'
          #!/bin/sh
          # cflx (Conflux) installer script
          set -e

          REPO="tumf/openspec-orchestrator"
          BINARY="cflx"

          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)

          case "$OS" in
            linux) OS="unknown-linux-gnu" ;;
            *) echo "Unsupported OS: $OS"; exit 1 ;;
          esac

          case "$ARCH" in
            x86_64) ARCH="x86_64" ;;
            arm64|aarch64) ARCH="aarch64" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac

          TARGET="${ARCH}-${OS}"
          VERSION="${VERSION:-latest}"

          if [ "$VERSION" = "latest" ]; then
            DOWNLOAD_URL="https://github.com/${REPO}/releases/latest/download/${BINARY}-${TARGET}.tar.gz"
          else
            DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${VERSION}/${BINARY}-${TARGET}.tar.gz"
          fi

          echo "Downloading ${BINARY} for ${TARGET}..."
          curl -fsSL "$DOWNLOAD_URL" | tar -xz

          INSTALL_DIR="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$INSTALL_DIR"
          mv "$BINARY" "$INSTALL_DIR/"
          chmod +x "$INSTALL_DIR/$BINARY"

          echo "Installed ${BINARY} to ${INSTALL_DIR}/${BINARY}"
          INSTALLER

      - name: Upload global artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-global
          path: artifacts/*

  # Create GitHub Release
  host:
    name: Create Release
    needs: [plan, build-global-artifacts]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: Release ${{ needs.plan.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.plan.outputs.tag, '-') }}
          generate_release_notes: true
          files: artifacts/*
